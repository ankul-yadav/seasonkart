 if(h.startsWith("item-")){const p=S.products.find(x=>x.id==h.slice(5));if(p)t=p.n+" | "+n}
 else if(h==="shop"&&cat)t=cat+" | "+n;else if(h==="cart")t="Your cart | "+n;else if(h==="orders")t="My orders | "+n;else if(h==="track")t="Track your order | "+n;
 else if(h.startsWith("page-")&&window.PAGES&&PAGES[h.slice(5)])t=PAGES[h.slice(5)].t+" | "+n;document.title=t}

function varInfo(p){const V=p.vs||[];if(!V.length)return null;
 const sizes=[...new Set(V.map(v=>v.s))].sort(szSort),ok=z=>V.some(v=>v.s===z&&v.st>0);
 if(!sizes.includes(size))size=sizes.find(ok)||sizes[0];
 const cols=[...new Set(V.filter(v=>v.s===size).map(v=>v.c))].filter(Boolean);
 if(!cols.length)col="";else if(!cols.includes(col))col=cols.find(c=>V.some(v=>v.s===size&&v.c===c&&v.st>0))||cols[0];

<div class="f h"><input id="pbs" placeholder="Sizes e.g. S,M,L,XL"><input id="pbc" placeholder="Colours e.g. Black,Navy (optional)"><input id="pbn" type="number" min="0" placeholder="Stock each"></div><button class="btn s" data-vbulk="${p.id}">Create all combinations</button>

function parseCSV(t){const rows=[];let r=[],f="",q=false;t=t.replace(/^\uFEFF/,"");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===","){r.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;r.push(f);f="";if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}

<button class="sk-assist-launch" id="skAssistLaunch" type="button" aria-controls="skAssistPanel" aria-expanded="false">✦ Shopping assistant</button>

<script>
(()=>{
 const panel=document.getElementById('skAssistPanel'),launch=document.getElementById('skAssistLaunch'),msgs=document.getElementById('skAssistMsgs'),input=document.getElementById('skAssistInput'),langBtn=document.getElementById('skAssistLang');
 let lang='en',products=null;
 const tr=(en,hi)=>lang==='hi'?hi:en;
 const add=(text,who='bot')=>{const d=document.createElement('div');d.className='sk-assist-msg'+(who==='user'?' user':'');d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d};
 const open=()=>{panel.classList.add('open');launch.setAttribute('aria-expanded','true');input.focus();if(!products)fetch('/api/products').then(r=>{if(!r.ok)throw Error('unavailable');return r.json()}).then(d=>{products=Array.isArray(d)?d:(d.products||[])}).catch(()=>{products=[]})};
 launch.addEventListener('click',()=>panel.classList.contains('open')?(panel.classList.remove('open'),launch.setAttribute('aria-expanded','false')):open());
 document.getElementById('skAssistClose').addEventListener('click',()=>{panel.classList.remove('open');launch.setAttribute('aria-expanded','false')});
 langBtn.addEventListener('click',()=>{lang=lang==='en'?'hi':'en';langBtn.textContent=lang==='en'?'हिन्दी':'English';document.getElementById('skAssistTitle').textContent=tr('SeasonKart shopping helper','SeasonKart खरीदारी सहायक');document.getElementById('skAssistNote').textContent=tr('Free local product helper — not a paid AI service. Recommendations use current store listings.','मुफ़्त लोकल प्रोडक्ट सहायक — paid AI service नहीं। सुझाव स्टोर की मौजूदा लिस्टिंग से हैं।');input.placeholder=tr('e.g. phone under ₹15000','जैसे ₹15000 से कम का फोन');});
 function norm(p){return {id:p.id,name:p.n||p.name||p.title||'Product',category:p.c||p.category||'',brand:p.b||p.brand||'',price:Number(p.p||p.price||0),stock:Number(p.st??p.stock??1),image:p.t||p.i||p.image||''}}
 function answer(q){const text=q.toLowerCase(),list=(products||[]).map(norm);if(!list.length)return add(tr('I could not load the current product catalogue. Please use the store search or try again in a moment.','मैं अभी प्रोडक्ट लिस्ट नहीं खोल पाया। स्टोर सर्च इस्तेमाल करें या थोड़ी देर बाद कोशिश करें।'));
 const budgetMatch=text.match(/(?:under|below|less than|कम|तक|नीचे)\s*₹?\s*([\d,]+)/i)||text.match(/₹\s*([\d,]+)/);const budget=budgetMatch?Number(budgetMatch[1].replace(/,/g,'')):null;
 const terms=text.replace(/₹?\s*[\d,]+/g,' ').split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>2&&!['under','below','less','than','with','want','need','show','find','best','some','please','product','products','मुझे','चाहिए','दिखाओ','कोई','और','एक'].includes(w));
 let found=list.filter(p=>p.stock>0&&(!budget||p.price<=budget)&&(!terms.length||terms.some(t=>(p.name+' '+p.category+' '+p.brand).toLowerCase().includes(t))));
 if(!found.length&&terms.length)found=list.filter(p=>p.stock>0&&(!budget||p.price<=budget));
 found.sort((a,b)=>a.price-b.price);found=found.slice(0,4);
 if(!found.length){add(tr('I could not find an in-stock match for that budget. Try a higher budget or another search term.','इस बजट में स्टॉक वाला प्रोडक्ट नहीं मिला। थोड़ा बजट बढ़ाकर या दूसरा शब्द डालकर देखें।'));return}
 add(tr('Here are some matching products from the current catalogue:','मौजूदा कैटलॉग में ये मिलते-जुलते प्रोडक्ट हैं:'));
 const wrap=document.createElement('div');wrap.className='sk-assist-products';found.forEach(p=>{const a=document.createElement('a');a.className='sk-assist-product';a.href='/p/'+encodeURIComponent(p.id);if(p.image){const im=document.createElement('img');im.src=p.image;im.alt='';im.loading='lazy';a.appendChild(im)}const sp=document.createElement('span'),b=document.createElement('b');b.textContent=p.name;sp.appendChild(b);sp.appendChild(document.createTextNode((p.category?p.category+' · ':'')+'₹'+p.price.toLocaleString('en-IN')));a.appendChild(sp);wrap.appendChild(a)});msgs.appendChild(wrap);msgs.scrollTop=msgs.scrollHeight;
 }
 document.getElementById('skAssistForm').addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q)return;add(q,'user');input.value='';if(!products){add(tr('Loading products…','प्रोडक्ट लोड हो रहे हैं…'));fetch('/api/products').then(r=>r.json()).then(d=>{products=Array.isArray(d)?d:(d.products||[]);answer(q)}).catch(()=>add(tr('Catalogue is temporarily unavailable.','कैटलॉग अभी उपलब्ध नहीं है।')))}else answer(q)});
})();
</script>
